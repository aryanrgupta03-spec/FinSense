version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: finsense-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finsense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finsense_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-finsensedb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finsense -d finsensedb"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finsense-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://finsense:finsense_secure_pass_2026@postgres:5432/finsensedb
      - JWT_SECRET=${JWT_SECRET:-finsense-production-secret-key-super-secure-2026}
      - SLM_ENABLED=true
      - SLM_API_BASE=${SLM_API_BASE:-http://localhost:11434/v1}
      - SLM_MODEL_NAME=${SLM_MODEL_NAME:-llama3.2:1b}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finsense-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
